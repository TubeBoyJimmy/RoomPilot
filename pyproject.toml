[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roompilot"
version = "0.2.0"
description = "Local REW measurement and room PEQ workspace"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "numpy>=2,<3", "scipy>=1.14,<2", "javaobj-py3>=0.4,<1"]

[project.scripts]
roompilot = "roompilot.app:main"

[tool.setuptools.package-data]
roompilot = ["ui/*.qml", "ui/components/*.qml", "ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
